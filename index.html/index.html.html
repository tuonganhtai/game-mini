<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Hạ gục kẻ địch Tiếng Trung</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap"
    />
    <style>
      :root {
        color-scheme: dark;
        --ink: #ffffff;
        --mut: #cfe6ff;
        --blood: #ff3d6e;
        --olive: #00a6ff;
        --line: #ffd23b;
        --hd: "Oswald", "Noto Sans SC", "Microsoft YaHei", Impact, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0a0807;
        overflow: hidden;
        font-family: system-ui, "Noto Sans SC", "Microsoft YaHei", sans-serif;
        color: var(--ink);
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        cursor: crosshair;
        touch-action: none;
      }
      .screen {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
        background: radial-gradient(
          ellipse at center,
          rgba(255, 255, 255, 0),
          rgba(10, 30, 80, 0.35)
        );
      }
      .screen.on {
        display: flex;
      }
      .card {
        width: min(580px, calc(100% - 24px));
        max-height: calc(100% - 24px);
        overflow: auto;
        padding: 22px;
        background: rgba(14, 40, 104, 0.94);
        border: 3px solid var(--line);
        outline: 1px dashed rgba(255, 255, 255, 0.4);
        outline-offset: -9px;
        box-shadow:
          0 0 0 1px #000,
          0 18px 60px #000;
      }
      h1 {
        margin: 0 0 18px;
        text-align: center;
        font: 700 clamp(38px, 10.5vw, 64px)/1.08 var(--hd);
        letter-spacing: 0.02em;
        background: linear-gradient(180deg, #fff7a8, #ffd23b 45%, #ff7a1a);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 4px 0 #0b2a6b)
          drop-shadow(0 0 20px rgba(255, 210, 59, 0.55));
      }
      h2 {
        margin: 0;
        font: 700 26px var(--hd);
        letter-spacing: 0.04em;
      }
      .sub {
        margin: 6px 0 16px;
        text-align: center;
        font: 500 20px var(--hd);
        letter-spacing: 0.2em;
        color: #c9b88a;
      }
      h3 {
        margin: 18px 0 8px;
        font: 500 15px var(--hd);
        letter-spacing: 0.06em;
        color: var(--mut);
      }
      p {
        line-height: 1.6;
        margin: 8px 0;
      }
      .sum {
        text-align: center;
        font-size: 15px;
      }
      .hint {
        text-align: center;
        color: var(--mut);
        font-size: 13px;
      }
      .row {
        display: flex;
        gap: 10px;
        margin-top: 18px;
        flex-wrap: wrap;
      }
      .row .b {
        flex: 1;
      }
      button {
        font: inherit;
        color: var(--ink);
        cursor: pointer;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .chips button,
      .w,
      .b {
        background: #1f4fb3;
        border: 1px solid #6fb2ff;
        padding: 8px 12px;
        border-radius: 2px;
        font-size: 14px;
      }
      button[aria-pressed="true"] {
        background: #ffd23b;
        border-color: #fff;
        color: #14264f;
        font-weight: 700;
      }
      .b {
        padding: 12px 16px;
        font: 700 17px var(--hd);
        letter-spacing: 0.06em;
        border-color: #ffb703;
      }
      .b.main {
        background: linear-gradient(#ffd23b, #ff8a1a);
        border-color: #fff;
        color: #3a1a00;
      }
      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible {
        outline: 2px solid #ffd23b;
        outline-offset: 2px;
      }
      .words {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
        gap: 6px;
        margin-top: 8px;
      }
      .w {
        text-align: left;
      }
      .w b {
        font-size: 18px;
        margin-right: 6px;
      }
      .w small {
        display: block;
        color: var(--mut);
        font-size: 12px;
        margin-top: 2px;
      }
      .w[aria-pressed="true"] small {
        color: #5a4300;
      }
      .tg {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin: 12px 18px 0 0;
        font-size: 14px;
      }
      textarea {
        width: 100%;
        background: #0c2a70;
        border: 1px solid #6fb2ff;
        color: var(--ink);
        padding: 10px;
        font: 14px/1.5 inherit;
        resize: vertical;
      }
      .warn {
        color: #ff8a95;
        font-size: 14px;
        min-height: 20px;
      }
      .nm {
        display: block;
        margin: 12px 0 0;
        font-size: 14px;
        color: var(--mut);
      }
      .nm input {
        width: 100%;
        margin-top: 6px;
        padding: 10px;
        background: #0c2a70;
        border: 1px solid #6fb2ff;
        color: #fff;
        font: 600 16px inherit;
        border-radius: 2px;
      }
      .bl {
        list-style: none;
        margin: 12px 0 0;
        padding: 0;
      }
      .bl li {
        display: grid;
        grid-template-columns: 34px 1fr auto;
        gap: 8px;
        padding: 9px 6px;
        border-bottom: 1px solid rgba(111, 178, 255, 0.3);
        font-size: 15px;
        align-items: center;
      }
      .bl li.me {
        background: rgba(255, 210, 59, 0.18);
      }
      .bl .rk {
        font: 700 18px var(--hd);
        color: #ffd23b;
      }
      .bl .sc {
        font: 700 20px var(--hd);
        color: #ffd23b;
      }
      .bl small {
        display: block;
        color: var(--mut);
        font-size: 12px;
      }
      #bs {
        position: fixed;
        left: max(12px, env(safe-area-inset-left));
        bottom: max(12px, env(safe-area-inset-bottom));
        display: none;
        background: rgba(14, 40, 104, 0.9);
        border: 1px solid #ffd23b;
        padding: 8px 14px;
        font-size: 14px;
      }
      .big {
        text-align: center;
        font: 700 72px/1 var(--hd);
        color: #ffd23b;
        margin: 10px 0 2px;
      }
      #om ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      #om li {
        font-size: 14px;
        margin: 5px 0;
      }
      #om b {
        font-size: 18px;
        margin-right: 4px;
      }
      #bm {
        position: fixed;
        right: max(12px, env(safe-area-inset-right));
        bottom: max(12px, env(safe-area-inset-bottom));
        display: none;
        background: rgba(14, 40, 104, 0.9);
        border: 1px solid #ffd23b;
        padding: 8px 14px;
        font-size: 14px;
      }
      #ans {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        width: min(430px, calc(100% - 24px));
        display: none;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
        z-index: 5;
      }
      @media (min-width: 700px) {
        #ans {
          width: min(760px, calc(100% - 24px));
          grid-template-columns: repeat(4, 1fr);
        }
      }
      #ans button {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 52px;
        padding: 6px 8px;
        background: rgba(14, 40, 104, 0.94);
        border: 2px solid #ffd23b;
        border-radius: 4px;
        line-height: 1.15;
        text-align: center;
      }
      #ans button i {
        font: 800 13px var(--hd);
        font-style: normal;
        color: #14264f;
        background: #ffd23b;
        border-radius: 50%;
        width: 22px;
        height: 22px;
        flex: none;
        display: grid;
        place-items: center;
      }
      #ans button.zh span {
        font:
          700 26px "Noto Sans SC",
          "Microsoft YaHei",
          "PingFang SC",
          sans-serif;
      }
      #ans button.vi span {
        font:
          600 14px "Segoe UI",
          sans-serif;
      }
      #ans button:hover:not(:disabled) {
        background: #1f4fb3;
      }
      #ans button:disabled {
        cursor: default;
      }
      #ans button.ok {
        background: #16a34a;
        border-color: #fff;
      }
      #ans button.bad {
        background: #dc2626;
        border-color: #fff;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="ans"></div>
    <div id="menu" class="screen on">
      <div class="card">
        <h1>Tiêu Diệt Địch<br />Bằng Tiếng Trung</h1>
        <p class="sum" id="sum"></p>
        <label class="nm"
          >Cho anh xin tên của bấy bi
          <input id="nm" maxlength="16" autocomplete="off" placeholder="Player"
        /></label>
        <div class="row">
          <button class="b main" id="go">Combat now</button
          ><button class="b" id="bx">BXH</button
          ><button class="b" id="st">Setting</button>
        </div>
        <p class="hint">Nhấn R để nghe lại phát âm, Esc để về menu.</p>
      </div>
    </div>
    <div id="set" class="screen">
      <div class="card">
        <h2>Setting</h2>
        <h3>Kiểu câu hỏi</h3>
        <div class="chips" id="cm"></div>
        <label class="tg"
          ><input type="checkbox" id="hint" /> Hiện gợi ý ở đề bài</label
        >
        <label class="tg"><input type="checkbox" id="snd" /> Âm thanh</label>
        <label class="tg"><input type="checkbox" id="voc" /> Đọc phát âm</label>
        <h3>Độ khó</h3>
        <div class="chips" id="cd"></div>
        <h3>Số mạng</h3>
        <div class="chips" id="cl"></div>
        <h3>Tốc độ giọng đọc</h3>
        <div class="chips" id="cv"></div>
        <p class="hint" id="vh" style="text-align: left"></p>
        <h3>Chọn từ cần luyện <span id="cnt"></span></h3>
        <div class="chips" id="cg"></div>
        <div class="words" id="cw"></div>
        <p class="warn" id="warn"></p>
        <h3>Thêm từ của bạn</h3>
        <textarea
          id="ta"
          rows="3"
          placeholder="Mỗi dòng một từ, dạng: 汉字 | pinyin | nghĩa&#10;Ví dụ: 苹果 | píngguǒ | quả táo"
        ></textarea>
        <div class="row">
          <button class="b" id="add">Thêm vào danh sách</button>
        </div>
        <p class="hint" id="am"></p>
        <div class="row"><button class="b main" id="done">Xong</button></div>
      </div>
    </div>
    <div id="over" class="screen">
      <div class="card">
        <h2 style="text-align: center">Game over</h2>
        <div class="big" id="os">0</div>
        <p class="hint" id="ob"></p>
        <div id="om"></div>
        <div class="row">
          <button class="b main" id="again">Chơi lại</button
          ><button class="b" id="bx2">BXH</button
          ><button class="b" id="home">Menu</button>
        </div>
      </div>
    </div>
    <div id="bxs" class="screen">
      <div class="card">
        <h2>BXH</h2>
        <ol class="bl" id="bl"></ol>
        <p class="hint" id="bn"></p>
        <div class="row">
          <button class="b main" id="bback">Quay lại</button>
        </div>
      </div>
    </div>
    <button id="bs">🔊 Nghe lại</button>
    <button id="bm">Menu</button>
    <script>
      const c = document.getElementById("c"),
        x = c.getContext("2d"),
        $ = (i) => document.getElementById(i);
      const F =
        '"Noto Sans SC","Microsoft YaHei","PingFang SC","Segoe UI",sans-serif';
      const G = ["Mua sắm", "Màu sắc", "Ngữ pháp", "Từ của bạn"];
      const BASE = [
        ["过", "guo", "đã từng", 2],
        ["商场", "shāngchǎng", "trung tâm thương mại", 0],
        ["进去", "jìnqù", "đi vào", 0],
        ["条", "tiáo", "cái, chiếc (quần váy)", 0],
        ["裤子", "kùzi", "quần", 0],
        ["白色", "báisè", "màu trắng", 1],
        ["因为", "yīnwèi", "bởi vì", 2],
        ["试", "shì", "thử", 0],
        ["红色", "hóngsè", "màu đỏ", 1],
        ["所以", "suǒyǐ", "cho nên", 2],
        ["书包", "shūbāo", "cặp sách", 0],
        ["过去", "guòqù", "đi sang", 0],
        ["绿色", "lǜsè", "màu xanh lá cây", 1],
        ["黑色", "hēisè", "màu đen", 1],
        ["更", "gèng", "càng, hơn", 2],
      ];
      let S = {
        mode: "vi2zh",
        hint: true,
        diff: 1,
        lives: 5,
        sound: true,
        voice: true,
        rate: 0.9,
        name: "",
        board: [],
        sel: null,
        custom: [],
      };
      try {
        Object.assign(S, JSON.parse(localStorage.getItem("htls2") || "{}"));
      } catch (e) {}
      if (!S.sel) S.sel = BASE.map((w) => w[0]);
      const save = () => {
        try {
          localStorage.setItem("htls2", JSON.stringify(S));
        } catch (e) {}
      };
      const all = () => BASE.concat(S.custom),
        pool = () => all().filter((w) => S.sel.includes(w[0]));
      const esc = (s) =>
        String(s).replace(
          /[&<>"]/g,
          (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[m],
        );
      let W,
        H,
        dpr,
        HZ,
        st = "idle",
        hp = 5,
        mhp = 5,
        score = 0,
        combo = 0,
        rounds = 0,
        tgt,
        qm = "vi2zh",
        en = [],
        pts = [],
        tr = [],
        shake = 0,
        flash = 0,
        muz = 0,
        msg = null,
        px = 0,
        mx = 0,
        my = 0,
        t = 0,
        best = 0,
        miss = {},
        nf = 2,
        fl = null,
        fires = [],
        ac = null;
      try {
        best = +localStorage.getItem("htls") || 0;
      } catch (e) {}
      const R = (a, b) => a + Math.random() * (b - a);
      const rng = (a) => () => {
        a |= 0;
        a = (a + 0x6d2b79f5) | 0;
        let q = Math.imul(a ^ (a >>> 15), 1 | a);
        q = (q + Math.imul(q ^ (q >>> 7), 61 | q)) ^ q;
        return ((q ^ (q >>> 14)) >>> 0) / 4294967296;
      };
      const bg = document.createElement("canvas");
      const sp = document.createElement("canvas");
      sp.width = sp.height = 128;
      {
        const s = sp.getContext("2d"),
          g = s.createRadialGradient(64, 64, 0, 64, 64, 64);
        g.addColorStop(0, "rgba(240,245,255,.55)");
        g.addColorStop(1, "rgba(240,245,255,0)");
        s.fillStyle = g;
        s.fillRect(0, 0, 128, 128);
      }
      const smokes = Array.from({ length: 7 }, () => ({
        x: R(0, 1),
        y: R(0.05, 0.5),
        s: R(0.3, 0.7),
        v: R(0.004, 0.012),
      }));
      const embers = Array.from({ length: 40 }, () => ({
        x: R(0, 1),
        y: R(0, 1),
        v: R(0.02, 0.07),
        p: R(0, 6),
      }));
      function buildBG() {
        bg.width = W * dpr;
        bg.height = H * dpr;
        const b = bg.getContext("2d");
        b.setTransform(dpr, 0, 0, dpr, 0, 0);
        const r = rng(11),
          rr = (a, z) => a + r() * (z - a),
          u = H / 700;
        HZ = H * 0.54;
        fires = [];
        let g = b.createLinearGradient(0, 0, 0, HZ);
        g.addColorStop(0, "#1e9bff");
        g.addColorStop(0.55, "#7fd3ff");
        g.addColorStop(1, "#fff1b8");
        b.fillStyle = g;
        b.fillRect(0, 0, W, H);
        g = b.createRadialGradient(
          W * 0.7,
          HZ - H * 0.1,
          3,
          W * 0.7,
          HZ - H * 0.1,
          H * 0.3,
        );
        g.addColorStop(0, "rgba(255,255,220,1)");
        g.addColorStop(0.2, "rgba(255,230,120,.65)");
        g.addColorStop(1, "rgba(255,210,80,0)");
        b.fillStyle = g;
        b.fillRect(0, 0, W, H);
        for (let i = 0; i < 16; i++) {
          b.fillStyle = "rgba(255,255,255," + rr(0.25, 0.55) + ")";
          b.beginPath();
          b.ellipse(
            rr(0, W),
            rr(H * 0.04, HZ),
            rr(W * 0.15, W * 0.45),
            rr(10, 32) * u,
            0,
            0,
            6.283,
          );
          b.fill();
        }
        const city = (col, yb, hmin, hmax, lit) => {
          for (let q = -30; q < W; ) {
            const w = rr(30, 84),
              h = rr(hmin, hmax) * u;
            b.fillStyle = col;
            b.beginPath();
            b.moveTo(q, yb + 4);
            b.lineTo(q, yb - h);
            for (let i = 1; i <= 3; i++)
              b.lineTo(
                q + (w * i) / 3,
                yb - h + rr(0, h * (i < 3 ? 0.22 : 0.1)),
              );
            b.lineTo(q + w, yb + 4);
            b.fill();
            for (let i = 0; i < lit; i++) {
              b.fillStyle =
                r() < 0.5 ? "rgba(255,240,150,.95)" : "rgba(30,40,70,.85)";
              b.fillRect(
                q + rr(4, w - 10),
                yb - h + rr(h * 0.3, h * 0.95),
                5,
                7,
              );
            }
            q += w + rr(-6, 10);
          }
        };
        city("#7f95c9", HZ, 40, 110, 3);
        city("#4f628f", HZ + H * 0.02, 70, 170, 5);
        fires.push({ x: W * 0.45, y: HZ - 70 * u, s: 0.8 * u * 1.3 });
        g = b.createLinearGradient(0, HZ, 0, H);
        g.addColorStop(0, "#9ccf4a");
        g.addColorStop(1, "#4c8a2b");
        b.fillStyle = g;
        b.fillRect(0, HZ + H * 0.02, W, H);
        for (let i = 0; i < 8; i++) {
          const cx = rr(0, W),
            cy = rr(HZ + H * 0.1, H - 120);
          b.fillStyle = "rgba(70,45,15,.3)";
          b.strokeStyle = "rgba(255,255,255,.25)";
          b.beginPath();
          b.ellipse(cx, cy, rr(30, 90) * u, rr(6, 16) * u, 0, 0, 6.283);
          b.fill();
          b.stroke();
        }
        const tree = (x0, y0, len, ang, d, w, col) => {
          if (d < 0 || len < 4) return;
          const x1 = x0 + Math.cos(ang) * len,
            y1 = y0 + Math.sin(ang) * len;
          b.strokeStyle = col;
          b.lineWidth = w;
          b.lineCap = "round";
          b.beginPath();
          b.moveTo(x0, y0);
          b.lineTo(x1, y1);
          b.stroke();
          for (let i = 0, n = r() < 0.3 ? 3 : 2; i < n; i++)
            tree(
              x1,
              y1,
              len * rr(0.62, 0.8),
              ang + rr(-0.8, 0.8),
              d - 1,
              w * 0.68,
              col,
            );
        };
        for (let i = 0; i < 7; i++)
          tree(
            rr(0, W),
            rr(HZ + H * 0.06, HZ + H * 0.26),
            rr(34, 60) * u,
            -1.57 + rr(-0.25, 0.25),
            5,
            4 * u,
            "#5a3d22",
          );
        const tank = (tx, ty, s) => {
          b.fillStyle = "#4a5e2e";
          b.fillRect(tx - 62 * s, ty - 14 * s, 124 * s, 16 * s);
          b.beginPath();
          b.arc(tx - 62 * s, ty - 6 * s, 8 * s, 0, 6.283);
          b.arc(tx + 62 * s, ty - 6 * s, 8 * s, 0, 6.283);
          b.fill();
          b.fillRect(tx - 50 * s, ty - 34 * s, 100 * s, 22 * s);
          b.beginPath();
          b.moveTo(tx - 30 * s, ty - 34 * s);
          b.lineTo(tx - 20 * s, ty - 52 * s);
          b.lineTo(tx + 22 * s, ty - 52 * s);
          b.lineTo(tx + 34 * s, ty - 34 * s);
          b.fill();
          b.save();
          b.translate(tx + 22 * s, ty - 44 * s);
          b.rotate(-0.12);
          b.fillRect(0, -3 * s, 78 * s, 6 * s);
          b.restore();
        };
        const tx = W * 0.2,
          ty = HZ + H * 0.2;
        tank(tx, ty, u * 1.1);
        fires.push({ x: tx - 10 * u, y: ty - 56 * u, s: 1.1 * u * 1.2 });
        b.fillStyle = "#b4491f";
        b.fillRect(W * 0.62, HZ + H * 0.16, 16 * u, 22 * u);
        fires.push({ x: W * 0.62 + 8 * u, y: HZ + H * 0.16, s: 0.9 * u * 1.2 });
        const sold = (sx, sy, s, d, k) => {
          b.save();
          b.translate(sx, sy);
          b.scale(d * s, s);
          b.fillStyle = "#34502a";
          if (k) {

          try {
            ac = new (window.AudioContext || window.webkitAudioContext)();
          } catch (_) {}
      });
      addEventListener("keydown", (e) => {
        if (st === "play" && /^[1-4]$/.test(e.key)) choose(+e.key - 1);
        if ((e.key === "r" || e.key === "R") && st === "play") speak(tgt, true);
        if (e.key === "Escape" && st === "play") {
          st = "idle";
          en = [];
          show("menu");
        }
      });
      const MODES = {
        vi2zh: "Nghĩa → Chữ Hán",
        zh2vi: "Chữ Hán → Nghĩa",
        py2zh: "Pinyin → Chữ Hán",
        mix: "Ngẫu nhiên",
      };
      function menu() {
        $("nm").value = S.name || "";
        $("sum").innerHTML =
          "Kiểu câu hỏi: <b>" +
          MODES[S.mode] +
          "</b><br>Từ đã chọn: <b>" +
          pool().length +
          "</b> · Số mạng: <b>" +
          S.lives +
          "</b> · Kỷ lục: <b>" +
          best +
          "</b>";
      }
      function chips(el, o, cur, fn, rd) {
        el.innerHTML = "";
        o.forEach(([v, l]) => {
          const b = document.createElement("button");
          b.textContent = l;
          b.setAttribute("aria-pressed", v === cur);
          b.onclick = () => {
            fn(v);
            save();
            (rd || renderSet)();
          };
          el.appendChild(b);
        });
      }
      function renderSet() {
        chips($("cm"), Object.entries(MODES), S.mode, (v) => {
          S.mode = v;
        });
        chips(
          $("cd"),
          [
            [0.7, "Dễ"],
            [1, "Vừa"],
            [1.4, "Khó"],
          ],
          S.diff,
          (v) => {
            S.diff = v;
          },
        );
        chips(
          $("cl"),
          [
            [3, "3 mạng"],
            [5, "5 mạng"],
            [7, "7 mạng"],
          ],
          S.lives,
          (v) => {
            S.lives = v;
          },
        );
        $("hint").checked = S.hint;
        $("snd").checked = S.sound;
        $("voc").checked = S.voice;
        chips(
          $("cv"),
          [
            [0.7, "Chậm"],
            [0.9, "Vừa"],
          ],
          S.rate,
          (v) => {
            S.rate = v;
          },
        );
        {
          const b = document.createElement("button");
          b.textContent = "🔊 Nghe thử";
          b.onclick = () => speak(pool()[0] || BASE[0], true);
          $("cv").appendChild(b);
          $("vh").textContent = !window.speechSynthesis
            ? "Trình duyệt này không hỗ trợ đọc phát âm."
            : zhv
              ? ""
              : "Thiết bị chưa có giọng đọc tiếng Trung. Nếu không nghe thấy tiếng, hãy cài thêm giọng trong cài đặt hệ thống.";
        }
        const A = all(),
          cg = $("cg");
        cg.innerHTML = "";
        const gb = (l, fn, on) => {
          const b = document.createElement("button");
          b.textContent = l;
          b.setAttribute("aria-pressed", !!on);
          b.onclick = () => {
            fn();
            save();
            renderSet();
          };
          cg.appendChild(b);
        };
        gb(
          "Chọn tất cả",
          () => {
            S.sel = A.map((w) => w[0]);
          },
          A.length === S.sel.length,
        );
        gb(
          "Bỏ hết",
          () => {
            S.sel = [];
          },
          false,
        );
        G.forEach((n, g) => {
          const ws = A.filter((w) => w[3] === g);
          if (!ws.length) return;
          const on = ws.every((w) => S.sel.includes(w[0]));
          gb(
            n + " (" + ws.length + ")",
            () => {
              S.sel = S.sel.filter((h) => !ws.some((w) => w[0] === h));
              if (!on) ws.forEach((w) => S.sel.push(w[0]));
            },
            on,
          );
        });
        $("cnt").textContent = "(" + pool().length + "/" + A.length + ")";
        const cw = $("cw");
        cw.innerHTML = "";
        A.forEach((w) => {
          const b = document.createElement("button"),
            on = S.sel.includes(w[0]);
          b.className = "w";
          b.setAttribute("aria-pressed", on);
          b.innerHTML =
            "<b>" +
            esc(w[0]) +
            "</b>" +
            esc(w[1]) +
            "<small>" +
            esc(w[2]) +
            "</small>";
          b.onclick = () => {
            S.sel = on ? S.sel.filter((h) => h !== w[0]) : S.sel.concat(w[0]);
            save();
            renderSet();
          };
          cw.appendChild(b);
        });
        $("warn").textContent =
          pool().length < 4 ? "Cần chọn ít nhất 4 từ để chơi." : "";
      }
      $("hint").onchange = (e) => {
        S.hint = e.target.checked;
        save();
      };
      $("snd").onchange = (e) => {
        S.sound = e.target.checked;
        save();
      };
      $("voc").onchange = (e) => {
        S.voice = e.target.checked;
        save();
      };
      $("add").onclick = () => {
        let n = 0;
        $("ta")
          .value.split("\n")
          .forEach((l) => {
            const p = l.split("|").map((s) => s.trim());
            if (
              p.length >= 3 &&
              p[0] &&
              p[2] &&
              !all().some((w) => w[0] === p[0]) &&
              S.custom.length < 60
            ) {
              S.custom.push([p[0], p[1], p[2], 3]);
              S.sel.push(p[0]);
              n++;
            }
          });
        $("am").textContent = n
          ? "Đã thêm " + n + " từ."
          : "Chưa thêm được từ nào. Mỗi dòng cần dạng: 汉字 | pinyin | nghĩa";
        if (n) $("ta").value = "";
        save();
        renderSet();
      };
      function renderBX() {
        const L = S.board,
          ol = $("bl");
        ol.innerHTML = "";
        L.forEach((e, i) => {
          const li = document.createElement("li");
          li.innerHTML =
            '<span class="rk">' +
            (i + 1) +
            "</span><span>" +
            esc(e.n || "Người chơi") +
            "<small>" +
            esc(MODES[e.m] || "") +
            " · " +
            new Date(e.d || 0).toLocaleDateString("vi-VN") +
            '</small></span><span class="sc">' +
            (+e.s || 0) +
            "</span>";
          ol.appendChild(li);
        });
        $("bn").textContent = !L.length ? "Chưa có điểm nào. Hãy ra trận!" : "";
      }
      $("bx").onclick = () => show("bxs");
      $("bx2").onclick = () => show("bxs");
      $("bback").onclick = () => show("menu");
      $("bs").onclick = () => speak(tgt, true);
      $("nm").oninput = (e) => {
        S.name = e.target.value.trim().slice(0, 16);
        save();
      };
      $("go").onclick = start;
      $("again").onclick = start;
      $("st").onclick = () => show("set");
      $("done").onclick = () => show("menu");
      $("home").onclick = () => show("menu");
      $("bm").onclick = () => {
        st = "idle";
        en = [];
        show("menu");
      };
      show("menu");
    </script>
  </body>
</html>
